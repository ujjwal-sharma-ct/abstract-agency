<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · Abstract VMS Agency Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#172554',
                        blue: '#1D4ED8',
                        purple: '#5B2E91',
                        lightbg: '#F3F4F6',
                        success: '#16A34A',
                        warning: '#F59E0B',
                        danger: '#DC2626'
                    },
                    fontFamily: {
                        sora: ['Sora', 'sans-serif'],
                        manrope: ['Manrope', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Sora', sans-serif; }
    </style>
</head>
<body class="font-manrope" style="background: linear-gradient(160deg, #0f1a3e 0%, #172554 35%, #1e1a4a 65%, #2d1a5e 100%);">

<main class="min-h-screen flex items-center justify-center px-4 py-10 relative overflow-hidden">

    <!-- Soft brand glows -->
    <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
        <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full opacity-20" style="background: radial-gradient(circle, #1D4ED8 0%, transparent 70%);"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full opacity-15" style="background: radial-gradient(circle, #5B2E91 0%, transparent 70%);"></div>
    </div>

    <div class="w-full max-w-[400px] relative z-10">

        <!-- Logo on the gradient — centred, so no -ml compensation -->
        <div class="flex justify-center mb-6">
            <img id="brand-logo" src="logo.png" alt="Abstract VMS" class="h-24 w-auto"
                 onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block';"/>
            <div id="logo-fallback" style="display:none;" class="text-center">
                <span class="text-white font-sora font-bold text-3xl tracking-tight">Abstract</span>
                <span class="block text-white/60 text-sm font-bold uppercase tracking-[0.3em] mt-1">VMS</span>
            </div>
        </div>

        <!-- Portal identity -->
        <div class="flex flex-col items-center gap-2 mb-8">
            <span class="text-[11px] font-semibold uppercase tracking-[0.2em] text-white/50">Agency Portal</span>
        </div>

        <!-- Card -->
        <div class="bg-white border border-white/20 rounded-2xl shadow-2xl overflow-hidden">
            <div class="px-8 pt-8 pb-8">

                <!-- Password-reset confirmation (arriving from 2-… Set New Password) -->
                <div id="reset-success" class="hidden mb-5 bg-success/10 border border-success/20 rounded-lg p-3.5 flex items-start gap-3">
                    <i class="fa-solid fa-circle-check text-success mt-0.5 text-sm"></i>
                    <p class="text-sm text-gray-700">Your password has been reset. Sign in with your new password.</p>
                </div>

                <form id="login-form" class="flex flex-col gap-5" onsubmit="return false;">

                    <!-- Email -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-gray-700" for="email">Work email</label>
                        <div class="relative">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none">
                                <i class="fa-regular fa-envelope text-gray-400 text-sm"></i>
                            </div>
                            <input type="email" id="email" autocomplete="username" placeholder="name@agency.com"
                                class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-blue focus:ring-4 focus:ring-blue/10 transition-all duration-200"/>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-semibold text-gray-700" for="password">Password</label>
                            <a href="1-Abstractvms 2 - Forgot Passwor.html" class="text-xs font-semibold text-blue hover:text-navy transition-colors">Forgot password?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none">
                                <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
                            </div>
                            <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password"
                                class="w-full pl-11 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-blue focus:ring-4 focus:ring-blue/10 transition-all duration-200"/>
                            <button type="button" id="toggle-pw" aria-label="Show password"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                                <i class="fa-regular fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Keep me signed in -->
                    <label class="flex items-center gap-2.5 cursor-pointer -mt-0.5">
                        <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-gray-300 text-blue focus:ring-blue cursor-pointer"/>
                        <span class="text-sm text-gray-600">Keep me signed in</span>
                    </label>

                    <!-- Submit -->
                    <button id="login-submit" type="submit"
                        onclick="window.location.href='3-Abstractvms 2 - Dashboard Over.html'; return false;"
                        class="w-full py-3.5 rounded-lg text-white font-semibold text-sm flex items-center justify-center gap-2 transition-all duration-200 hover:opacity-95 hover:shadow-lg active:scale-[0.99] focus:outline-none focus:ring-4 focus:ring-blue/20 mt-1"
                        style="background: linear-gradient(135deg, #1D4ED8, #5B2E91);">
                        <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i> Sign in
                    </button>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-white/40 mt-6">© 2026 Abstract Recruitment</p>
    </div>
</main>

<script>
    const togglePw = document.getElementById('toggle-pw');
    const pwInput = document.getElementById('password');
    if (togglePw && pwInput) {
        togglePw.addEventListener('click', function () {
            const show = pwInput.type === 'password';
            pwInput.type = show ? 'text' : 'password';
            togglePw.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            togglePw.innerHTML = show
                ? '<i class="fa-regular fa-eye-slash text-sm"></i>'
                : '<i class="fa-regular fa-eye text-sm"></i>';
        });
    }

    // Arriving from Set New Password (2-…) — confirm the reset before asking for credentials.
    if (new URLSearchParams(window.location.search).get('reset') === '1') {
        document.getElementById('reset-success').classList.remove('hidden');
    }
</script>

</body>
</html>
